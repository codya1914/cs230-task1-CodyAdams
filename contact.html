<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Contact</title>
</head>

<body>

<header>
    <h1>Contact Form</h1>

    <nav>
        <a href="index.html">Home</a> |
        <a href="about.html">About HTML</a> |
        <a href="resources.html">Resources</a> |
        <a href="contact.html">Contact</a>
    </nav>
</header>

<main>

    <section id="formSection">
        <h2>Tell Me About Your HTML Experience</h2>

        <form>

            <p>
                <label for="firstname">Firstname:</label>

                <input
                        type="text"
                        id="firstname"
                        name="name"
                        required>

                <label for="lastname">Lastname:</label>

                <input
                    type="text"
                    id="lastname"
                    name="name"
                    required>
            </p>

            <p>
                <label for="email">Email:</label>

                <input
                        type="email"
                        id="email"
                        name="email"
                        required>
            </p>

            <p>
                <label for="age">Age:</label>

                <input
                        type="number"
                        id="age"
                        name="age"
                        min="1"
                        max="120">
            </p>

            <p>
                <label>
                    Beginner
                    <input
                            type="radio"
                            name="Options"
                            id="beginner">

                </label>

                <label>
                    Intermediate
                    <input
                            type="radio"
                            name="Options"
                            id="intermediate">
                </label>

                <label>
                    Advanced
                    <input
                            type="radio"
                            name="Options"
                            id="advanced">
                </label>
            </p>

            <p>
                <h2>Here is an example of a range:</h2>
                <label for="range1">
                    Range (1-100):
                    1
                    <input
                            name="range"
                            id="range1"
                            type="range"
                            min="1"
                            max="100">
                    100
                </label>
            </p>

            <p>
                <label for="level">Experience Level:</label>

                <select id="level" name="level" required>

                    <option value="">Choose one</option>
                    <option value="beginner">Beginner</option>
                    <option value="intermediate">Intermediate</option>
                    <option value="advanced">Advanced</option>

                </select>
            </p>

            <p>
                <label for="comments">Comments:</label>
            </p>

            <p>
                    <textarea
                            id="comments"
                            name="comments"
                            rows="5"
                            cols="30"></textarea>
            </p>

            <p>
                <input
                        type="checkbox"
                        id="agree"
                        name="agree"
                        required>

                <label for="agree">
                    I completed the form.
                </label>
            </p>

            <button type="submit">
                Submit
            </button>

        </form>

    </section>

</main>

<footer>
    <p>CS 230 HTML Project</p>
</footer>

</body>

</html>
